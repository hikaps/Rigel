name: Rigel Stable Release

# Stable release: every push to main builds the configured release version,
# publishes an immutable IPA release, and preserves both channels in the
# AltStore/SideStore source manifest.
# AltStore/SideStore re-signs the ad-hoc IPA with the installer's Apple ID.

env:
  STABLE_VERSION: "1.0.0"
  FFMPEG_VERSION: "7.1"

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer stable supersedes an older stable. The publication job has a shared
# non-cancelling manifest lock so beta and stable cannot race on develop.
concurrency:
  group: stable-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-stable-ipa:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JDK 21 (Xcode prebuild hardcodes brew prefix)
        run: brew install openjdk@21

      - id: apple-sdk
        name: Identify Xcode and iPhoneOS SDK for FFmpeg cache
        run: |
          set -euo pipefail
          echo "xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - id: ffmpeg-cache
        name: Restore FFmpeg device libs
        uses: actions/cache@v4
        with:
          path: iosApp/vendor/ffmpeg-device
          key: ffmpeg-device-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.apple-sdk.outputs.xcode }}-sdk-${{ steps.apple-sdk.outputs.sdk }}-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg device libs
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          FF_VERSION="$FFMPEG_VERSION" SDK=iphoneos JOBS=4 FF_BUILD_DIR="$RUNNER_TEMP/ffbuild-dev" ./scripts/build-ffmpeg.sh

      - name: Archive unsigned stable app
        env:
          MARKETING_VERSION: ${{ env.STABLE_VERSION }}
          CURRENT_PROJECT_VERSION: "${{ github.run_number }}"
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/Rigel.xcodeproj \
            -scheme Rigel \
            -configuration Release \
            -archivePath build/Rigel.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      - name: Package ad-hoc IPA
        env:
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          ASSET_NAME="Rigel-stable-${SHA:0:7}.ipa"
          APP="build/Rigel.xcarchive/Products/Applications/Rigel.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p build/payload/Payload
          cp -R "$APP" build/payload/Payload/
          (cd build/payload && zip -qry "$GITHUB_WORKSPACE/build/$ASSET_NAME" Payload)

      - name: Upload stable IPA
        uses: actions/upload-artifact@v4
        with:
          name: stable-ipa-${{ github.run_id }}
          path: build/Rigel-stable-*.ipa
          if-no-files-found: error

  publish-stable:
    needs: build-stable-ipa
    if: ${{ needs.build-stable-ipa.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    concurrency:
      group: rigel-altstore-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download stable IPA
        uses: actions/download-artifact@v4
        with:
          name: stable-ipa-${{ github.run_id }}
          path: build

      - name: Publish stable release and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          ASSET_NAME="Rigel-stable-${SHA:0:7}.ipa"
          IPA="build/$ASSET_NAME"
          TAG="v${STABLE_VERSION}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET_NAME"
          SOURCE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/develop/altstore/source.json"
          ICON_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/develop/iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

          # Generate against the latest develop snapshot so stable publication
          # retains the beta entry and never overwrites develop from main.
          git fetch origin develop
          MANIFEST_WORKTREE="${RUNNER_TEMP}/manifest"
          git worktree add --detach "$MANIFEST_WORKTREE" origin/develop
          trap 'git worktree remove --force "$MANIFEST_WORKTREE"' EXIT
          MANIFEST_SOURCE="$MANIFEST_WORKTREE/altstore/source.json"

          python3 scripts/generate-altstore-source.py \
            --channel stable \
            --ipa "$IPA" \
            --output "$MANIFEST_SOURCE" \
            --download-url "$DOWNLOAD_URL" \
            --source-url "$SOURCE_URL" \
            --icon-url "$ICON_URL" \
            --release-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$IPA" \
            --target "$SHA" \
            --title "Rigel ${STABLE_VERSION}" \
            --notes "Stable Rigel ${STABLE_VERSION} from main @ ${SHA:0:7}. This ad-hoc IPA is re-signed by AltStore/SideStore with the installer's Apple ID. The AltStore source is refreshed at ${SOURCE_URL}." \
            --latest=true
          gh release upload "$TAG" "$MANIFEST_SOURCE" --clobber

          git -C "$MANIFEST_WORKTREE" config user.name "github-actions[bot]"
          git -C "$MANIFEST_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$MANIFEST_WORKTREE" add altstore/source.json
          if ! git -C "$MANIFEST_WORKTREE" diff --cached --quiet; then
            git -C "$MANIFEST_WORKTREE" commit -m "chore: update AltStore source (stable) [skip ci]"
            git -C "$MANIFEST_WORKTREE" push origin HEAD:develop || {
              git -C "$MANIFEST_WORKTREE" fetch origin develop
              git -C "$MANIFEST_WORKTREE" rebase origin/develop
              git -C "$MANIFEST_WORKTREE" push origin HEAD:develop
            }
          fi
