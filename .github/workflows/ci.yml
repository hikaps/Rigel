name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fastest signal: 150 Kotlin unit tests on the JVM + coverage gate + report.
  unit-tests-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and coverage
        run: ./gradlew :composeApp:koverVerify :composeApp:koverXmlReport --console=plain
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: composeApp/build/reports/kover/
          if-no-files-found: error

  # Same Kotlin suites on the real iOS target (catches platform issues JVM can't).
  test-ios-kotlin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain

  # Full native suite: Swift unit tests (SSDP / HTTP server / FFmpeg probe).
  # Needs the gitignored FFmpeg vendor libs + generated media fixtures.
  # Non-blocking: the app currently fails to link with Xcode 26 SDK + Compose
  # 1.11.1 — Compose references the private UIKit symbol UIViewLayoutRegion,
  # absent from the SDK's public stubs. Fixed upstream in Compose 1.12.0-rc01
  # (JetBrains/compose-multiplatform-core#3278). Make required once the app's
  # Compose version is bumped (or ui-ux lands and drops Compose).
  test-ios-swift:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: iosApp/vendor/ffmpeg
          key: ffmpeg-sim-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: |
            ffmpeg-sim-
      - name: Install JDK 21 (Xcode prebuild hardcodes brew prefix)
        run: brew install openjdk@21
      - name: Install ffmpeg CLI (fixture generation)
        run: brew install ffmpeg
      - name: Build FFmpeg simulator libs
        run: ./scripts/build-ffmpeg.sh
      - name: Generate media fixtures
        run: ./scripts/gen-fixtures.sh
      - name: Run Swift unit tests
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/[[:space:]]*$//')"
          xcodebuild test \
            -project iosApp/Rigel.xcodeproj \
            -scheme Rigel \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
