name: Rigel CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "7.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Public PR signal: all tests run on disposable GitHub-hosted runners.
  # Device signing and rolling-beta release remain on the trusted self-hosted Mac.
  # The FFmpeg simulator build uses an Actions cache because hosted VMs are ephemeral.
  unit-tests-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test AltStore source generator
        run: python3 scripts/test_generate_altstore_source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and coverage
        run: ./gradlew :composeApp:koverVerify :composeApp:koverXmlReport --console=plain
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: composeApp/build/reports/kover/
          if-no-files-found: error

  # Same Kotlin suites on the real iOS target (catches platform issues JVM can't).
  # Note: ~/.konan is intentionally NOT cached via actions/cache — restoring it
  # deterministically breaks the Kotlin/Native build (config-phase failure, seen
  # twice). Fresh toolchain download costs ~2 min; gradle caches cover the rest.
  test-ios-kotlin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain

  # Full native suite: Swift unit tests (SSDP / HTTP server / FFmpeg probe).
  # Needs the gitignored FFmpeg vendor libs + generated media fixtures.
  # Gating: the SwiftUI pivot dropped Compose, so the former link failure
  # (private UIKit symbol UIViewLayoutRegion, Compose 1.11.1) cannot recur.
  test-ios-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JDK 21 (Xcode prebuild hardcodes brew prefix)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list --versions openjdk@21 >/dev/null 2>&1 || brew install openjdk@21
      - name: Install ffmpeg CLI (fixture generation)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list --versions ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - id: apple-sdk
        name: Identify Xcode and iPhoneSimulator SDK for FFmpeg cache
        run: |
          set -euo pipefail
          echo "xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - id: ffmpeg-cache
        name: Restore FFmpeg simulator libs
        uses: actions/cache@v4
        with:
          path: iosApp/vendor/ffmpeg
          key: ffmpeg-sim-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.apple-sdk.outputs.xcode }}-sdk-${{ steps.apple-sdk.outputs.sdk }}-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg simulator libs
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          # Pin parallelism (parallel make races on generated headers) and retry once.
          FF_VERSION="$FFMPEG_VERSION" JOBS=4 FF_BUILD_DIR="$RUNNER_TEMP/ffbuild-sim" ./scripts/build-ffmpeg.sh \
            || FF_VERSION="$FFMPEG_VERSION" JOBS=4 FF_BUILD_DIR="$RUNNER_TEMP/ffbuild-sim" ./scripts/build-ffmpeg.sh
      - name: Generate media fixtures
        run: ./scripts/gen-fixtures.sh
      - name: Verify XcodeGen 2.46.0 project drift
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew list --versions mint >/dev/null 2>&1 || brew install mint
          XCODEGEN_VERSION="$(mint run --silent yonaskolb/XcodeGen@2.46.0 xcodegen --version | tail -n 1 | tr -d '\r')"
          test "$XCODEGEN_VERSION" = "Version: 2.46.0"
          (cd iosApp && mint run --silent yonaskolb/XcodeGen@2.46.0 xcodegen generate)
          git diff --exit-code -- iosApp/Rigel.xcodeproj/project.pbxproj
      - name: Run Swift unit tests
        run: |
          # Pin by UDID: name+OS:latest fails on runners with mixed simulator
          # runtimes (e.g. iPhone 16 Pro only on iOS 18.2 while Xcode's latest
          # runtime is 26.x). First available iPhone simulator wins.
          DEVICE_UDID="$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for v in d['devices'].values() for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')))" )"
          # Certificate-free simulator signing enables the real Keychain regression.
          cat > "$RUNNER_TEMP/rigel-test.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>application-identifier</key><string>RIGELTESTS.com.rigel.player</string>
          <key>keychain-access-groups</key><array><string>RIGELTESTS.com.rigel.player</string></array>
          <key>get-task-allow</key><true/>
          </dict></plist>
          PLIST
          xcodebuild test \
            -project iosApp/Rigel.xcodeproj \
            -scheme Rigel \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath "$HOME/rigel-deriveddata" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/rigel-test.entitlements"